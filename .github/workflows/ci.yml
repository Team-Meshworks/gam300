name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Exercise the C# reader against the same contract cases used by the browser suite
  project-format:
    needs: select
    if: needs.select.outputs.server == 'true'
    name: Shared project format and server formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: apps/server/global.json
          cache: true
          cache-dependency-path: apps/server/**/packages.lock.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked browser-reader tooling
        working-directory: apps/web
        run: |
          npm install --global npm@11.21.1
          npm ci --no-audit --no-fund
      - name: Validate the shared fixtures and server round trips
        run: dotnet run --project apps/server/project-format-checks/Spatia.ProjectFormat.Checks.csproj -c Release
      - name: Reopen each writer's output in the other runtime
        run: node apps/web/tests/project-format-cross.check.mjs

      - name: Check server formatting
        working-directory: apps/server
        run: |
          dotnet restore tests/Spatia.Server.Tests.csproj --locked-mode
          dotnet format Spatia.Server/Spatia.Server.csproj --verify-no-changes --no-restore
          dotnet format tests/Spatia.Server.Tests.csproj --verify-no-changes --no-restore

  compatibility:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch'
    name: Native checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-26]
    defaults:
      run:
        working-directory: apps/web
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install and check the native toolchain
        run: |
          npm install --global npm@11.21.1
          npm ci --no-audit --no-fund
          node ../../tools/setup.check.mjs
          npm run check:architecture
      - name: Check native browser policy
        run: npm run test:browser-policy
      - name: Build on the native platform
        run: npm run build

  select:
    name: Select CI checks
    runs-on: ubuntu-24.04
    outputs:
      proof: ${{ steps.plan.outputs.proof }}
      browser: ${{ steps.plan.outputs.browser }}
      server: ${{ steps.plan.outputs.server }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 -B .github/ci/test_ci.py
          python3 -B .github/ci/browser_matrix.py

  architecture:
    name: Architecture proof
    needs: select
    if: needs.select.outputs.proof == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked tooling
        run: |
          npm install --global npm@11.21.1
          npm ci --no-audit --no-fund
      - uses: ./.github/actions/setup-chrome
      - name: Prove architecture enforcement and isolated module removal
        run: npm run test:architecture
      - name: Retain architecture evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: architecture-${{ github.sha }}
          path: apps/web/test-results/
          retention-days: 14
          overwrite: true

  fixtures:
    needs: select
    if: needs.select.outputs.browser != '[]'
    name: Browser checks (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.browser) }}
    defaults:
      run:
        working-directory: apps/web
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked tooling
        run: |
          npm install --global npm@11.21.1
          npm ci --no-audit --no-fund
      - uses: ./.github/actions/setup-chrome
      - name: Start Vite server
        run: |
          mkdir -p test-results
          node prepare-dashboard-font.mjs
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5173 --strictPort \
            > "test-results/dev-server-${{ matrix.name }}.log" 2>&1 &
          echo $! > vite.pid
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:5173/ > /dev/null
      - name: Run browser checks
        env:
          CHECKS: ${{ matrix.checks }}
        run: |
          failed=0
          while read -r check path; do
            [[ -n "$check" ]] || continue
            started=$SECONDS
            if ! CHECK_SCREENSHOT="test-results/$check.png" npm run "test:$check" -- "http://127.0.0.1:5173$path" | tee "test-results/$check.log"; then
              failed=1
            fi
            printf '%s\t%d\n' "$check" "$((SECONDS - started))" >> test-results/browser-seconds.tsv
          done <<< "$CHECKS"
          exit "$failed"
      - name: Stop Vite server
        if: always()
        run: |
          if [[ -f vite.pid ]]; then
            kill "$(cat vite.pid)" 2>/dev/null || true
          fi
      - name: Retain fixture evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixture-${{ matrix.name }}-${{ github.sha }}
          path: apps/web/test-results/
          retention-days: 14
          overwrite: true

  source:
    name: Web source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked tooling
        run: |
          npm install --global npm@11.21.1
          npm ci --no-audit --no-fund
      - name: Check lint, types, units and source in parallel
        run: bash ../../.github/ci/web-checks.sh
      - name: Retain source-check evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-${{ github.sha }}
          path: |
            apps/web/test-results/source-*.log
            apps/web/test-results/unit.xml
            docs/architecture-graph.json
            docs/architecture-graph.md
          retention-days: 14
          overwrite: true

  check:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch'
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BUILD_MODE: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    defaults:
      run:
        working-directory: apps/web
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked tooling
        run: |
          npm install --global npm@11.21.1
          npm ci --no-audit --no-fund
      - uses: ./.github/actions/setup-chrome
      - name: Check browser isolation and real HTTP cache
        run: npm run test:browser-security
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the runnable image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: spatia-ci:${{ github.sha }}
          build-args: |
            REVISION=${{ github.sha }}
            BUILD_MODE=${{ env.BUILD_MODE }}
            RUN_BUILD_CHECKS=false
          cache-from: type=gha,scope=editor
          cache-to: type=gha,mode=max,scope=editor
      - name: Check the packaged application
        id: packaged
        env:
          APP_IMAGE: spatia-ci:${{ github.sha }}
          APP_PORT: "4173"
          REVISION: ${{ github.sha }}
          CHECK_SCREENSHOT: test-results/deployment.png
        run: |
          docker compose -f ../../compose.yaml -p spatia-ci up -d --no-build --wait --wait-timeout 90
          test "$(curl --fail --silent http://127.0.0.1:4173/version.txt)" = "$GITHUB_SHA"
          # Test files from the actual image, including the separate private catalogue root.
          # The Caddy harness first proves anonymous byte denial, then provides a synthetic
          # full session for the existing authoring browser checks.
          mkdir -p test-results "$RUNNER_TEMP/packaged-public" "$RUNNER_TEMP/packaged-restricted"
          web=$(docker compose -f ../../compose.yaml -p spatia-ci ps -q web)
          docker cp "$web:/srv/." "$RUNNER_TEMP/packaged-public/"
          docker cp "$web:/srv-restricted/." "$RUNNER_TEMP/packaged-restricted/"
          docker run --rm --entrypoint /bin/cat caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b /usr/bin/caddy > "$RUNNER_TEMP/spatia-caddy"
          chmod +x "$RUNNER_TEMP/spatia-caddy"
          CADDY_BINARY="$RUNNER_TEMP/spatia-caddy" node ../../deploy/gateway.check.mjs
          CADDY_BINARY="$RUNNER_TEMP/spatia-caddy" node ../../deploy/restricted-assets.check.mjs \
            "$RUNNER_TEMP/packaged-public" "$RUNNER_TEMP/packaged-restricted" --browser \
            2>&1 | tee test-results/packaged-catalogue.log
      - name: Check the editor API and database together
        env:
          APP_IMAGE: spatia-ci:${{ github.sha }}
          API_IMAGE: spatia-api-ci:${{ github.sha }}
          MIGRATION_IMAGE: spatia-migrations-ci:${{ github.sha }}
          APP_PORT: "4173"
          SERVER_PORT: "8444"
        run: |
          umask 077
          printf 'SPATIA_DATABASE_PASSWORD=%s\nSPATIA_API_PASSWORD=%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > ../../.env
          stack=(docker compose --env-file ../../.env -f ../../compose.yaml -f ../../compose.server.yaml -p spatia-ci)
          "${stack[@]}" build api migrate
          "${stack[@]}" up -d --no-build --wait --wait-timeout 120
          "${stack[@]}" exec -T api node /app/tools/validate-intake.mjs < ../../assets/delivery/test-crate.glb > test-results/packaged-asset-validation.json
          node -e "const assert = require('node:assert/strict'); const result = require('./test-results/packaged-asset-validation.json'); assert.equal(result.valid, true)"
          docker cp "$("${stack[@]}" ps -q gateway):/data/caddy/pki/authorities/local/root.crt" test-results/server-root.crt
          # Compose waits for running containers; Caddy still needs to start TLS and issue its certificate.
          curl --fail --silent --show-error --retry 12 --retry-delay 1 --retry-all-errors --max-time 5 --retry-max-time 60 --cacert test-results/server-root.crt https://localhost:8444/healthz
          curl --fail --silent --show-error --cacert test-results/server-root.crt --output /dev/null https://localhost:8444/
          curl --fail --silent --show-error --retry 12 --retry-delay 1 --retry-connrefused --max-time 5 --retry-max-time 60 --cacert test-results/server-root.crt --output /dev/null https://localhost:8444/api/v1/auth/csrf
          test "$(curl --silent --show-error --cacert test-results/server-root.crt --output /dev/null --write-out '%{http_code}' https://localhost:8444/api/v1/auth/session)" = 401
          models=("$RUNNER_TEMP"/packaged-restricted/*.glb)
          test -f "${models[0]}"
          model=$(basename "${models[0]}")
          test "$(curl --silent --show-error --cacert test-results/server-root.crt --output /dev/null --write-out '%{http_code}' "https://localhost:8444/restricted-assets/$model")" = 401
          migrations=$("${stack[@]}" exec -T postgres psql -U spatia -d spatia -tAc 'SELECT count(*) FROM public."__EFMigrationsHistory"')
          test "$migrations" -ge 2
          "${stack[@]}" run --rm --no-deps migrate
          test "$("${stack[@]}" exec -T postgres psql -U spatia -d spatia -tAc 'SELECT count(*) FROM public."__EFMigrationsHistory"')" = "$migrations"
          test "$("${stack[@]}" exec -T postgres psql -U spatia -d spatia -tAc "SELECT rolsuper, rolcreatedb, rolcreaterole FROM pg_roles WHERE rolname = 'spatia_api'")" = 'f|f|f'
          for pause in on off; do
            "${stack[@]}" exec -T postgres psql -X -U spatia -d spatia -v "pause=$pause" < ../../deploy/dev-create-guard.sql
          done
      - name: Capture container diagnostics
        if: always()
        # Collect before uploading so failed deployment checks leave downloadable logs
        # The stack may not exist if an earlier build step failed
        run: |
          mkdir -p test-results
          extra=()
          if [[ -f ../../.env ]]; then extra=(--env-file ../../.env -f ../../compose.server.yaml); fi
          docker compose -f ../../compose.yaml "${extra[@]}" -p spatia-ci logs --no-color --tail 100 > test-results/containers.log 2>&1 || true
      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checks-${{ github.sha }}
          path: |
            apps/web/test-results/*.log
            apps/web/test-results/packaged-asset-validation.json
            apps/web/test-results/server-root.crt
            apps/web/test-results/*.png
            apps/web/test-results/scrum168/*.png
          retention-days: 14
          overwrite: true
      - name: Retain the verified public web build for review
        if: ${{ !cancelled() && steps.packaged.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-${{ github.sha }}
          path: ${{ runner.temp }}/packaged-public/
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Save the tested image and its deployment files
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        run: |
          mkdir -p ../../ci-artifacts/release
          docker save "spatia-ci:$GITHUB_SHA" "spatia-api-ci:$GITHUB_SHA" "spatia-migrations-ci:$GITHUB_SHA" -o ../../ci-artifacts/image.tar
          cp ../../compose.yaml ../../deploy/deploy.sh ../../ci-artifacts/release/
          cp ../../compose.server.yaml ../../ci-artifacts/release/
          mkdir -p ../../ci-artifacts/release/deploy
          cp ../../deploy/{server.Caddyfile,dev-cutover.sh,dev-creates.caddy,dev-create-guard.sql} ../../ci-artifacts/release/deploy/
      - name: Transfer the tested image to the publishing job
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ github.sha }}
          path: ci-artifacts/
          retention-days: 2
          overwrite: true
      - name: Container cleanup
        if: always()
        run: |
          extra=()
          if [[ -f ../../.env ]]; then extra=(--env-file ../../.env -f ../../compose.server.yaml); fi
          docker compose -f ../../compose.yaml "${extra[@]}" -p spatia-ci down --volumes
          rm -f ../../.env

  server:
    needs: select
    if: needs.select.outputs.server == 'true'
    name: Server tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    outputs:
      inventory_1: ${{ steps.tests.outputs.inventory_1 }}
      inventory_2: ${{ steps.tests.outputs.inventory_2 }}
    defaults:
      run:
        working-directory: apps/server
        shell: bash
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_DB: spatia_scrum45_test
          POSTGRES_USER: spatia_test
          POSTGRES_PASSWORD: spatia_ci_only
        ports:
          - "127.0.0.1::5432"
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -U spatia_test -d spatia_scrum45_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The login browser check starts the real Vite app and validates its asset catalogue.
          lfs: true
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: apps/server/global.json
          cache: true
          cache-dependency-path: apps/server/**/packages.lock.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install the existing browser test dependencies
        working-directory: apps/web
        run: |
          npm install --global npm@11.21.1
          npm ci --no-audit --no-fund
      - uses: ./.github/actions/setup-chrome
      - name: Prepare the proxy test binary
        run: |
          # Exercise the actual pinned proxy binary with the production ASP.NET middleware
          docker run --rm --entrypoint /bin/cat caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b /usr/bin/caddy > "$RUNNER_TEMP/spatia-caddy"
          chmod +x "$RUNNER_TEMP/spatia-caddy"
          echo "CADDY_BINARY=$RUNNER_TEMP/spatia-caddy" >> "$GITHUB_ENV"
      - name: Restore and build the server
        run: |
          dotnet restore tests/Spatia.Server.Tests.csproj --locked-mode
          dotnet build tests/Spatia.Server.Tests.csproj -c Release --no-restore
      - name: Check server migrations
        if: matrix.shard == 1
        env:
          ConnectionStrings__Spatia: Host=127.0.0.1;Port=${{ job.services.postgres.ports['5432'] }};Database=spatia_scrum45_test;Username=spatia_test;Password=spatia_ci_only
        run: |
          dotnet tool restore
          mkdir -p .artifacts
          dotnet ef migrations list --no-connect --project Spatia.Server --startup-project tests --configuration Release --no-build
          dotnet ef migrations has-pending-model-changes --project Spatia.Server --startup-project tests --configuration Release --no-build
          dotnet ef migrations script --idempotent --project Spatia.Server --startup-project tests --configuration Release --no-build --output .artifacts/identity-migration.sql
      - name: Run server regression tests
        id: tests
        env:
          SPATIA_TEST_DATABASE_CONNECTION: Host=127.0.0.1;Port=${{ job.services.postgres.ports['5432'] }};Database=spatia_scrum45_test;Username=spatia_test;Password=spatia_ci_only
          ConnectionStrings__Spatia: Host=127.0.0.1;Port=${{ job.services.postgres.ports['5432'] }};Database=spatia_scrum45_test;Username=spatia_test;Password=spatia_ci_only
        run: |
          python3 -B ../../.github/ci/server_shard.py ${{ matrix.shard }}
      - name: Retain server test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-checks-${{ matrix.shard }}-${{ github.sha }}
          path: |
            apps/server/test-results/ci/
            apps/server/.artifacts/scrum45-browser-version.txt
            apps/server/.artifacts/scrum45-part7-browser-version.txt
          retention-days: 14
          overwrite: true

  server-inventory:
    name: Verify complete server test coverage
    needs: server
    runs-on: ubuntu-24.04
    steps:
      - env:
          FIRST: ${{ needs.server.outputs.inventory_1 }}
          SECOND: ${{ needs.server.outputs.inventory_2 }}
        run: test -n "$FIRST" && test "$FIRST" = "$SECOND"

  publish:
    name: Publish tested image
    needs:
      [
        check,
        source,
        compatibility,
        server-inventory,
        project-format,
        select,
        architecture,
        fixtures,
      ]
    if: >-
      always() &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
      needs.check.result == 'success' &&
      needs.source.result == 'success' &&
      needs.compatibility.result == 'success' &&
      needs.server-inventory.result == 'success' &&
      needs.project-format.result == 'success' &&
      needs.fixtures.result == 'success' &&
      needs.select.result == 'success' &&
      (
        needs.architecture.result == 'success' ||
        (
          needs.architecture.result == 'skipped' &&
          needs.select.outputs.proof == 'false'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ github.sha }}
          path: ci-artifacts
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact image that passed the browser checks
        shell: bash
        run: |
          docker load -i ci-artifacts/image.tar
          tag="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_REF_NAME-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          pids=()
          for suffix in '' -api -migrations; do
            docker tag "spatia$suffix-ci:$GITHUB_SHA" "$tag$suffix"
            docker push "$tag$suffix" &
            pids+=("$!")
          done
          failed=0
          for pid in "${pids[@]}"; do
            wait "$pid" || failed=1
          done
          test "$failed" -eq 0
          image=$(docker inspect --format '{{index .RepoDigests 0}}' "$tag")
          api_image=$(docker inspect --format '{{index .RepoDigests 0}}' "$tag-api")
          migration_image=$(docker inspect --format '{{index .RepoDigests 0}}' "$tag-migrations")
          jq -n --arg image "$image" --arg apiImage "$api_image" --arg migrationImage "$migration_image" \
            --arg commit "$GITHUB_SHA" --arg branch "$GITHUB_REF_NAME" --arg run "$GITHUB_RUN_ID" \
            '{image: $image, apiImage: $apiImage, migrationImage: $migrationImage, commit: $commit, branch: $branch, run: $run}' \
            > ci-artifacts/release/release.json
          printf 'Image: `%s`\n\nCommit: `%s`\n\nDeploy workflow CI run ID: `%s`\n' \
            "$image" "$GITHUB_SHA" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the release descriptor
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}
          path: ci-artifacts/release/
          retention-days: 90
          overwrite: true
