name: Deploy

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI run ID for the current selected branch commit (older releases are rejected)
        required: true
        type: string

      recovery_from_revision:
        description: Optional full failed revision; use only after reviewing retained database compatibility
        required: false
        type: string
      recovery_review:
        description: Optional approved recovery review reference or rationale (required with recovery revision)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    # Reject manual runs from other branches before allocating a runner
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    name: Verify release and branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.release.outputs.environment }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/web/.nvmrc
      - name: Require a successful CI run from this branch
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/heads/main) environment=production ;;
            refs/heads/dev) environment=development ;;
            *) echo 'Only main and dev can deploy' >&2; exit 1 ;;
          esac
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          workflow=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml" --jq .id)
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > run.json
          node deploy/verify-release.mjs run.json "$GITHUB_REF_NAME" "$workflow" "$GITHUB_SHA"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq -r .head_sha run.json)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy verified release
    needs: release
    runs-on: [self-hosted, Linux, X64, vthere-deploy]
    timeout-minutes: 10
    environment:
      name: ${{ needs.release.outputs.environment }}
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - name: Isolate temporary credentials and release files
        shell: bash
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/vthere-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "RELEASE_DIR=$RUNNER_TEMP/vthere-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.release.outputs.commit }}
          path: ${{ env.RELEASE_DIR }}
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and deploy; keep failed server releases closed for reviewed recovery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_COMMIT: ${{ needs.release.outputs.commit }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          APP_URL: ${{ vars.APP_URL }}
          RECOVERY_FROM_REVISION: ${{ inputs.recovery_from_revision }}
          RECOVERY_REVIEW: ${{ inputs.recovery_review }}
          DEPLOY_BASIC_AUTH_USERNAME: ${{ secrets.DEPLOY_BASIC_AUTH_USERNAME }}
          DEPLOY_BASIC_AUTH_PASSWORD: ${{ secrets.DEPLOY_BASIC_AUTH_PASSWORD }}
          DEPLOY_ENVIRONMENT: ${{ needs.release.outputs.environment }}
        shell: bash
        run: |
          # Recheck after environment approval so an old artifact cannot run its old deploy script
          [[ "$EXPECTED_COMMIT" == "$GITHUB_SHA" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)" == "$EXPECTED_COMMIT" ]]
          jq -e --arg branch "$GITHUB_REF_NAME" --arg commit "$EXPECTED_COMMIT" --arg run "$CI_RUN_ID" \
            '.branch == $branch and .commit == $commit and .run == $run' "$RELEASE_DIR/release.json"
          if [[ -f "${DEPLOY_ROOT:-$HOME/vthere}/$DEPLOY_ENVIRONMENT/current/compose.server.yaml" ]]; then
            jq -e '.apiImage and .migrationImage' "$RELEASE_DIR/release.json"
          fi
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          bash "$RELEASE_DIR/deploy.sh" "$GITHUB_REF_NAME" \
            "$(jq -er .image "$RELEASE_DIR/release.json")" "$EXPECTED_COMMIT" \
            "$(jq -r '.apiImage // empty' "$RELEASE_DIR/release.json")" \
            "$(jq -r '.migrationImage // empty' "$RELEASE_DIR/release.json")"
          printf 'Deployed `%s` to %s\n' "$EXPECTED_COMMIT" "$APP_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary registry credentials and release files
        if: always()
        shell: bash
        run: rm -rf -- "$DOCKER_CONFIG" "$RELEASE_DIR"
