services:
  web:
    image: ${APP_IMAGE:-vthere:local}
    build:
      context: .
      args:
        REVISION: ${REVISION:-local}
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /config
      - /data
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
