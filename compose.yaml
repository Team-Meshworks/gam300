services:
  web:
    image: ${APP_IMAGE:-vthere:local}
    build:
      context: .
      args:
        REVISION: ${REVISION:-local}
        BUILD_MODE: ${BUILD_MODE:-development}
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /config:uid=1000,gid=1000,mode=0700
      - /data:uid=1000,gid=1000,mode=0700
      - /tmp:uid=1000,gid=1000,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
